{% extends "base.html" %}{% from "_macros.html" import icon with context %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') if current_user else url_for('main.index') }}">{{ icon('arrow-left', 17) }} Back to {{ 'overview' if current_user else 'home' }}</a>
</div>
{% endblock %}
